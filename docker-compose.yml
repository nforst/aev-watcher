services:
  aev-watcher:
    build: .
    restart: unless-stopped
    environment:
      # Leer lassen bzw. "self" = Nachricht an das eigene Konto.
      WHATSAPP_TO: ${WHATSAPP_TO:-self}
      STATE_FILE: /app/data/state.json
      WA_AUTH_DIR: /app/data/wa-auth
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
      MAX_MESSAGES_PER_RUN: ${MAX_MESSAGES_PER_RUN:-10}
      NOTIFY_ON_FIRST_RUN: ${NOTIFY_ON_FIRST_RUN:-false}
    volumes:
      # Enthaelt die WhatsApp-Kopplung und den Zustand. Ohne dieses Volume
      # muesstest du nach jedem Deploy neu koppeln.
      - aev-data:/app/data

volumes:
  aev-data:
