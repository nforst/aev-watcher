services:
  aev-watcher:
    build: .
    restart: unless-stopped
    environment:
      OPENWA_BASE_URL: ${OPENWA_BASE_URL}
      OPENWA_API_KEY: ${OPENWA_API_KEY}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID}
      WHATSAPP_TO: ${WHATSAPP_TO}
      STATE_FILE: /app/data/state.json
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
      MAX_MESSAGES_PER_RUN: ${MAX_MESSAGES_PER_RUN:-10}
      NOTIFY_ON_FIRST_RUN: ${NOTIFY_ON_FIRST_RUN:-false}
    volumes:
      - aev-state:/app/data
    # Variante A (Standard): der Container prueft selbst im Intervall.
    # Variante B (Coolify Scheduled Task): naechste Zeile einkommentieren,
    # dann haelt der Container nur still und der Scheduler ruft
    # `node /app/src/index.js` auf.
    # command: ["sleep", "infinity"]

volumes:
  aev-state:
